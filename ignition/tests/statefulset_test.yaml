suite: StatefulSet Tests
release:
  name: ignition
  namespace: ignition-test
templates:
- statefulset.yaml
- configmap.yaml
tests:
# General tests for StatefulSet Structure
- it: Renders StatefulSet
  template: statefulset.yaml
  asserts:
  - containsDocument:
      kind: StatefulSet
      apiVersion: apps/v1
      name: ignition-gateway
# Security Context Tests
- it: Validate Default Pod Security Context
  template: statefulset.yaml
  asserts:
  - equal:
      path: spec.template.spec.securityContext
      value:
        runAsUser: 2003
        runAsGroup: 2003
        fsGroup: 2003
        runAsNonRoot: true
- it: Validate Custom Pod Security Context
  template: statefulset.yaml
  set:
    podSecurityContext:
      runAsUser: 1234
  asserts:
  - equal:
      path: spec.template.spec.securityContext
      value:
        runAsUser: 1234
- it: Validate Omitted Pod Security Context
  template: statefulset.yaml
  set:
    podSecurityContext: null
  asserts:
  - notExists:
      path: spec.template.spec.securityContext
- it: Validate Default Container Security Context
  template: statefulset.yaml
  asserts:
  - equal:
      path: spec.template.spec.containers[0].securityContext
      value:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
          - ALL
        seccompProfile:
          type: RuntimeDefault
  - equal:
      path: spec.template.spec.initContainers[0].securityContext
      value:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
          - ALL
        seccompProfile:
          type: RuntimeDefault
- it: Validate Custom Container Security Context
  template: statefulset.yaml
  set:
    gateway:
      securityContext:
        allowPrivilegeEscalation: true
        seccompProfile:
          type: RuntimeDefault
      preconfigure:
        securityContext:
          allowPrivilegeEscalation: true
  asserts:
  - equal:
      path: spec.template.spec.containers[0].securityContext
      value:
        allowPrivilegeEscalation: true
        seccompProfile:
          type: RuntimeDefault
  - equal:
      path: spec.template.spec.initContainers[0].securityContext
      value:
        allowPrivilegeEscalation: true
- it: Validate Omitted Container Security Context
  template: statefulset.yaml
  set:
    gateway.securityContext: null
    gateway.preconfigure.securityContext: null
  asserts:
  - notExists:
      path: spec.template.spec.containers[0].securityContext
  - notExists:
      path: spec.template.spec.initContainers[0].securityContext
# Misc Tests
- it: Validate Miscellaneous Settings
  template: statefulset.yaml
  asserts:
  # Make sure that our config map is linked into the environment of the gateway container
  - contains:
      path: spec.template.spec.containers[0].envFrom
      content:
        configMapRef:
          name: ignition-config-base
  # Check that our expected volume mounts exist
  - contains:
      path: spec.template.spec.containers[0].volumeMounts
      content:
        mountPath: /config/scripts
        name: config-scripts
        readOnly: true
  - contains:
      path: spec.template.spec.containers[0].volumeMounts
      content:
        mountPath: /config/files
        name: config-files
        readOnly: true
  - contains:
      path: spec.template.spec.containers[0].volumeMounts
      content:
        mountPath: /run/secrets/ignition
        name: secrets
        readOnly: true
  # Check that the associated volumes are defined
  - contains:
      path: spec.template.spec.volumes
      content:
        name: config-scripts
        configMap:
          name: ignition-config-scripts
          defaultMode: 0755
  - contains:
      path: spec.template.spec.volumes
      content:
        name: config-files
        configMap:
          name: ignition-config-files
          defaultMode: 0644
  # Check default arg count
  - lengthEqual:
      path: spec.template.spec.containers[0].args
      count: 14
# Verify StatefulSet naming
- it: Validate StatefulSet name
  template: statefulset.yaml
  release:
    name: ignition2
  asserts:
  - equal:
      path: metadata.name
      value: ignition2-gateway
- it: Validate StatefulSet full name override
  template: statefulset.yaml
  set:
    fullnameOverride: foo
  release:
    name: ignition2
  asserts:
  - equal:
      path: metadata.name
      value: foo-gateway
- it: Validate StatefulSet name override
  template: statefulset.yaml
  set:
    nameOverride: foo
  asserts:
  - equal:
      path: metadata.name
      value: ignition-foo-gateway
# Verify Pod Labels are applied correctly
- it: Validate Pod Base Labels
  template: statefulset.yaml
  chart:
    version: "0.1.0"
    appVersion: "8.3.0"
  release:
    name: ignition2
  asserts:
  - equal:
      path: metadata.labels
      value:
        app.kubernetes.io/name: ignition
        app.kubernetes.io/managed-by: Helm
        app.kubernetes.io/instance: ignition2
        app.kubernetes.io/version: "8.3.0"
        helm.sh/chart: ignition-0.1.0
- it: Validate Pod with Custom Labels
  template: statefulset.yaml
  chart:
    version: "0.1.0"
    appVersion: "8.3.0"
  set:
    podLabels:
      foo: bar
      bar: baz
    nameOverride: foo
  asserts:
  - equal:
      path: metadata.labels
      value:
        app.kubernetes.io/name: foo
        app.kubernetes.io/managed-by: Helm
        app.kubernetes.io/instance: ignition
        app.kubernetes.io/version: "8.3.0"
        helm.sh/chart: ignition-0.1.0
  - equal:
      path: spec.template.metadata.labels
      value:
        app.kubernetes.io/name: foo
        app.kubernetes.io/managed-by: Helm
        app.kubernetes.io/instance: ignition
        app.kubernetes.io/version: "8.3.0"
        helm.sh/chart: ignition-0.1.0
        foo: bar
        bar: baz
# Verify Pod AntiAffinity is applied correctly
- it: Validate Pod AntiAffinity
  template: statefulset.yaml
  set:
    podAntiAffinity: true
  release:
    name: ignition2
  asserts:
  - equal:
      path: spec.template.spec.affinity
      value:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values:
                - ignition
              - key: app.kubernetes.io/instance
                operator: In
                values:
                - ignition2
            topologyKey: kubernetes.io/hostname
- it: Validate Custom Pod AntiAffinity with template directive
  template: statefulset.yaml
  set:
    podAntiAffinity: false
    affinity:
      podAntiAffinity:
        preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          podAffinityTerm:
            labelSelector:
              matchLabels:
                app.kubernetes.io/name: ignition
            topologyKey: kubernetes.io/hostname
            namespaceSelector: {}
        requiredDuringSchedulingIgnoredDuringExecution:
        - labelSelector:
            matchExpressions:
            - key: app.kubernetes.io/name
              operator: In
              values:
              - '{{ include "ignition.name" . }}'
            - key: app.kubernetes.io/instance
              operator: In
              values:
              - '{{ .Release.Name }}'
          topologyKey: kubernetes.io/hostname
  asserts:
  - equal:
      path: spec.template.spec.affinity
      value:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchLabels:
                  app.kubernetes.io/name: ignition
              topologyKey: kubernetes.io/hostname
              namespaceSelector: {}
          requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values:
                - 'ignition'
              - key: app.kubernetes.io/instance
                operator: In
                values:
                - 'ignition'
            topologyKey: kubernetes.io/hostname
- it: Validate specifying both Pod AntiAffinity and Affinity fails
  template: statefulset.yaml
  set:
    podAntiAffinity: true
    affinity:
      podAntiAffinity:
        requiredDuringSchedulingIgnoredDuringExecution: []
  asserts:
  - failedTemplate:
      errorMessage: "affinity cannot be specified with podAntiAffinity=true"
# Validate Redundancy Preparation Script Inclusion
- it: Validate Redundancy Preparation Script Inclusion
  template: statefulset.yaml
  set:
    gateway.redundancy.enabled: true
  asserts:
  - contains:
      path: spec.template.spec.initContainers[0].args
      content: '/config/scripts/prepare-redundancy.sh -g "ignition-gateway-0.ignition" -v'
- it: Validate Redundancy Preparation Script Inclusion with no TLS
  template: statefulset.yaml
  set:
    gateway.redundancy.enabled: true
    gateway.env.GATEWAY_NETWORK_REQUIRESSL: false
  asserts:
  - lengthEqual:
      path: spec.template.spec.initContainers[0].args
      count: 3
  - contains:
      path: spec.template.spec.initContainers[0].args
      content: '/config/scripts/prepare-redundancy.sh -g "ignition-gateway-0.ignition" -k -v'
- it: Validate Redundancy Preparation Script Not Included when Redundancy Disabled
  template: statefulset.yaml
  asserts:
  - lengthEqual:
      path: spec.template.spec.initContainers[0].args
      count: 2
# Validate EmptyDir Data Volume
- it: Validate Presence of Volume Claim Template by default
  template: statefulset.yaml
  asserts:
  - lengthEqual:
      path: spec.volumeClaimTemplates
      count: 1
- it: Validate No Volume Claim Template and EmptyDir Volume when enabled
  template: statefulset.yaml
  set:
    gateway.dataVolumeUseEmptyDir: true
  asserts:
  - lengthEqual:
      path: spec.volumeClaimTemplates
      count: 0
  - contains:
      path: spec.template.spec.volumes
      content:
        name: data
        emptyDir:
          sizeLimit: "3Gi"
---
suite: StatefulSet Licensing Tests
release:
  name: ignition
  namespace: ignition-test
templates:
- statefulset.yaml
- configmap.yaml
tests:
# Leased Activation Licensing Tests
- it: Validate Leased License Configuration Fails without secretName (Standalone)
  template: statefulset.yaml
  set:
    gateway.licensing.leasedActivation:
      foo: bar
  asserts:
  - failedTemplate:
      errorMessage: "Must supply licensing Secret name"
- it: Validate Leased License Configuration Fails without secretName (Redundancy, Shared)
  template: statefulset.yaml
  set:
    gateway.redundancy.enabled: true
    gateway.licensing.leasedActivation:
      foo: bar
  asserts:
  - failedTemplate:
      errorMessage: "Must supply primary/backup or shared licensing Secret name"
- it: Validate Leased License Configuration Fails without secretName on primary (Redundancy, Split)
  template: statefulset.yaml
  set:
    gateway.redundancy.enabled: true
    gateway.licensing.primaryLeasedActivation:
      foo: bar
    gateway.licensing.backupLeasedActivation:
      secretName: leased-license2
  asserts:
  - failedTemplate:
      errorMessage: "Must supply primary/backup or shared licensing Secret name"
- it: Validate Leased License Configuration Fails without secretName on backup (Redundancy, Split)
  template: statefulset.yaml
  set:
    gateway.redundancy.enabled: true
    gateway.licensing.primaryLeasedActivation:
      secretName: leased-license1
    gateway.licensing.backupLeasedActivation:
      foo: bar
  asserts:
  - failedTemplate:
      errorMessage: "Must supply primary/backup or shared licensing Secret name"
- it: Validate Leased License Configuration (Standalone)
  template: statefulset.yaml
  set:
    gateway.licensing.leasedActivation:
      secretName: "leased-license1"
  asserts:
  - lengthEqual:
      path: spec.template.spec.volumes[2].projected.sources
      count: 2
  - contains:
      path: spec.template.spec.volumes[2].projected.sources
      content:
        secret:
          items:
          - key: ignition-license-key
            path: ignition-license-key
          - key: ignition-activation-token
            path: ignition-activation-token
          name: leased-license1
- it: Validate Leased License Configuration (Redundancy, Shared)
  template: statefulset.yaml
  set:
    gateway.redundancy.enabled: true
    gateway.licensing.leasedActivation:
      secretName: "leased-license1"
  asserts:
  - lengthEqual:
      path: spec.template.spec.volumes[2].projected.sources
      count: 2
  - contains:
      path: spec.template.spec.volumes[2].projected.sources
      content:
        secret:
          items:
          - key: ignition-license-key
            path: primary-ignition-license-key
          - key: ignition-activation-token
            path: primary-ignition-activation-token
          - key: ignition-license-key
            path: backup-ignition-license-key
          - key: ignition-activation-token
            path: backup-ignition-activation-token
          name: leased-license1
- it: Validate Leased License Configuration (Redundancy, Split)
  template: statefulset.yaml
  set:
    gateway.redundancy.enabled: true
    gateway.licensing:
      primaryLeasedActivation:
        secretName: "leased-license1"
      backupLeasedActivation:
        secretName: "leased-license2"
  asserts:
  - lengthEqual:
      path: spec.template.spec.volumes[2].projected.sources
      count: 3
  - contains:
      path: spec.template.spec.volumes[2].projected.sources
      content:
        secret:
          items:
          - key: ignition-license-key
            path: primary-ignition-license-key
          - key: ignition-activation-token
            path: primary-ignition-activation-token
          name: leased-license1
  - contains:
      path: spec.template.spec.volumes[2].projected.sources
      content:
        secret:
          items:
          - key: ignition-license-key
            path: backup-ignition-license-key
          - key: ignition-activation-token
            path: backup-ignition-activation-token
          name: leased-license2
- it: Validate Leased License Configuration Coalesce on Primary (Redundancy)
  template: statefulset.yaml
  set:
    gateway.redundancy.enabled: true
    gateway.licensing.leasedActivation:
      secretName: leased-license1
    gateway.licensing.backupLeasedActivation:
      secretName: leased-license2
      activationTokenKey: special-ignition-activation-token
  asserts:
  - lengthEqual:
      path: spec.template.spec.volumes[2].projected.sources
      count: 3
  - contains:
      path: spec.template.spec.volumes[2].projected.sources
      content:
        secret:
          items:
          - key: ignition-license-key
            path: primary-ignition-license-key
          - key: ignition-activation-token
            path: primary-ignition-activation-token
          name: leased-license1
  - contains:
      path: spec.template.spec.volumes[2].projected.sources
      content:
        secret:
          items:
          - key: ignition-license-key
            path: backup-ignition-license-key
          - key: special-ignition-activation-token
            path: backup-ignition-activation-token
          name: leased-license2
- it: Validate Leased License Configuration Coalesce on Backup (Redundancy)
  template: statefulset.yaml
  set:
    gateway.redundancy.enabled: true
    gateway.licensing.leasedActivation:
      secretName: leased-license1
      licenseKeyKey: special-ignition-license-key
    gateway.licensing.primaryLeasedActivation:
      secretName: leased-license2
  asserts:
  - lengthEqual:
      path: spec.template.spec.volumes[2].projected.sources
      count: 3
  - contains:
      path: spec.template.spec.volumes[2].projected.sources
      content:
        secret:
          items:
          - key: special-ignition-license-key
            path: primary-ignition-license-key
          - key: ignition-activation-token
            path: primary-ignition-activation-token
          name: leased-license2
  - contains:
      path: spec.template.spec.volumes[2].projected.sources
      content:
        secret:
          items:
          - key: special-ignition-license-key
            path: backup-ignition-license-key
          - key: ignition-activation-token
            path: backup-ignition-activation-token
          name: leased-license1
- it: Validate Leased License Configuration Split Keys on Shared Secret (Redundancy)
  template: statefulset.yaml
  set:
    gateway.redundancy.enabled: true
    gateway.licensing:
      leasedActivation:
        secretName: leased-license
      primaryLeasedActivation:
        licenseKeyKey: primary-license-key
        activationTokenKey: primary-activation-token
      backupLeasedActivation:
        licenseKeyKey: backup-license-key
        activationTokenKey: backup-activation-token
  asserts:
  - lengthEqual:
      path: spec.template.spec.volumes[2].projected.sources
      count: 2
  - contains:
      path: spec.template.spec.volumes[2].projected.sources
      content:
        secret:
          items:
          - key: primary-license-key
            path: primary-ignition-license-key
          - key: primary-activation-token
            path: primary-ignition-activation-token
          - key: backup-license-key
            path: backup-ignition-license-key
          - key: backup-activation-token
            path: backup-ignition-activation-token
          name: leased-license
- it: Validate Redundancy Preparation Script Inclusion with Leased Licensing (Shared)
  template: statefulset.yaml
  set:
    gateway.redundancy.enabled: true
    gateway.licensing.primaryLeasedActivation:
      secretName: leased-license1
    gateway.licensing.backupLeasedActivation:
      secretName: leased-license2
  asserts:
  - contains:
      path: spec.template.spec.initContainers[0].args
      content: '/config/scripts/prepare-redundancy.sh -g "ignition-gateway-0.ignition" -l -v'
- it: Validate Redundancy Preparation Script Inclusion with Leased Licensing (Shared)
  template: statefulset.yaml
  set:
    gateway.redundancy.enabled: true
    gateway.licensing.leasedActivation:
      secretName: leased-license
  asserts:
  - contains:
      path: spec.template.spec.initContainers[0].args
      content: '/config/scripts/prepare-redundancy.sh -g "ignition-gateway-0.ignition" -l -v'
- it: Validate Terminate Leased Sessions on Shutdown is applied when enabled
  template: statefulset.yaml
  set:
    gateway.licensing.leasedActivation:
      secretName: leased-license1
      terminateSessionOnShutdown: true
  asserts:
  - contains:
      path: spec.template.spec.containers[0].args
      content: '-Dignition.license.leased-activation-terminate-sessions-on-shutdown=true'
- it: Validate Terminate Leased Sessions on Shutdown deduplication of existing JVM arg
  template: statefulset.yaml
  set:
    gateway.licensing.leasedActivation:
      secretName: leased-license1
      terminateSessionOnShutdown: true
    gateway.jvmArgs:
    - '-Dignition.license.leased-activation-terminate-sessions-on-shutdown=true'
  asserts:
  - lengthEqual:
      path: spec.template.spec.containers[0].args
      count: 15
